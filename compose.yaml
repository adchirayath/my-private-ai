services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  my-private-ai:
    build: .
    container_name: my-private-ai
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      CHROMA_DB_PATH: /app/chroma_db
      UPLOAD_DIR: /app/uploads
      MAX_FILE_MB: ${MAX_FILE_MB:-25}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
      MAX_RETRIEVAL_DISTANCE: ${MAX_RETRIEVAL_DISTANCE:-0.52}
    volumes:
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
      - ./workspace:/app/workspace
      - ./app.py:/app/app.py
      - ./static:/app/static
      - ./core:/app/core
      - ./services:/app/services
      - ./routers:/app/routers
      - ./tests:/app/tests
      - ./docs:/app/docs
    restart: unless-stopped

volumes:
  ollama_models: